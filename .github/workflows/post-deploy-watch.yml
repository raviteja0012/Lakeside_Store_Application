name: Post-deploy watch

# Asks the live site whether it is still healthy, and says so in Slack when the answer
# changes.
#
# This is the half of the loop that makes the other half safe. Anything can be automated to
# ship; what makes shipping unattended defensible is that a bad release is caught by the
# machine within minutes instead of by the owner noticing a wrong figure next week.
#
# /api/health is answered by the app itself. It checks the things a build cannot: that the
# deployed app and the deployed database still agree on what an invoice owes, that the
# payments engine is installed, that the columns this release needs exist, and that no
# invoice is showing a status its own payments do not support. That last one is the drift
# detector: it is how a broken money change announces itself.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Post a test message to Slack, to prove alerts can reach the channel"
        type: boolean
        default: false

concurrency:
  group: post-deploy-watch
  cancel-in-progress: false

permissions:
  contents: read
  # Reading this workflow's own past runs is how the notifier knows whether it already said
  # the site was down. Without it every run would repeat itself.
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Give the deploy a moment to go live
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Ask the site how it is
        id: health
        env:
          SITE: ${{ vars.PRODUCTION_URL || 'https://robinsons-store.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node .github/scripts/health-check.mjs

      # A loop that raises an alarm has to stand it down, or the alarm goes on saying the site
      # is broken long after it was fixed and people stop reading it. That half used to be a
      # Jira ticket being closed; it is now a Slack message, and the run history is what
      # remembers which state we were in. One step covers both directions, and it never fails
      # the run: when the site is down the run is already red for the right reason.
      #
      # One API call and at most one POST, and no model call ever.
      - name: Tell Slack when that answer changes
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on schedules and post-deploy runs, so only a deliberate hand-run can test.
          TEST: ${{ inputs.test_slack }}
          HEALTHY: ${{ steps.health.outputs.healthy }}
          SUMMARY: ${{ steps.health.outputs.summary }}
          SITE: ${{ vars.PRODUCTION_URL || 'https://robinsons-store.vercel.app' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/health-notify.mjs

      - name: Fail the run so it is visible
        if: steps.health.outputs.healthy == 'false'
        run: |
          echo "The live site reported a problem:"
          echo "${{ steps.health.outputs.summary }}"
          exit 1
