name: CI

on:
  push:
    branches: [main, claude/great-johnson-CFSbi]
  pull_request:
    branches: [main]
  # On demand, for any branch. Added 2026-08-06 after a push landed (Vercel deployed it)
  # without GitHub creating a CI run at all, and there was no way to ask for one: the gates
  # could only be re-run by pushing another commit. A pull request with no CI result looks
  # exactly like a pull request whose CI has not finished, and neither is a state to merge
  # from.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      # The automation's own rules, checked like any other code. These are the two
      # decisions nothing else can catch: which changes may merge themselves, and when a
      # closed ticket counts as work again.
      - name: Automation rules
        run: |
          node .github/scripts/jira-find-work.test.mjs
          node .github/scripts/raise-health-ticket.test.mjs
          node .github/scripts/jira-transition.test.mjs
          node --check .github/scripts/classify-change.mjs
          node --check .github/scripts/jira-comment.mjs
          node --check .github/scripts/health-check.mjs
          node --check .github/scripts/raise-health-ticket.mjs
          node --check .github/scripts/jira-transition.mjs
          node --check .github/scripts/jira-approved.mjs
          node --check .github/scripts/resolve-health-ticket.mjs
          # seed_dev.sql must never reach a real database through the migration workflow.
          # It is dev-only dummy data, and run-order.txt is the only list that runs.
          if grep -qE '^\s*seed' supabase/run-order.txt; then
            echo "::error::run-order.txt names a seed file. Seeds are never applied automatically."
            exit 1
          fi
